<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一起算帳</title><style>
*{box-sizing:border-box}body{margin:0;background:#eff4f8;color:#172b3d;font-family:system-ui,"Noto Sans TC",sans-serif}main{max-width:1060px;margin:auto;padding:28px 18px}.brand{display:flex;gap:12px;align-items:center;border-bottom:1px solid #d8e1e8;padding-bottom:22px;margin-bottom:20px}.logo{background:#173a5e;color:#fff;width:45px;height:45px;border-radius:15px;display:grid;place-items:center;font-size:24px}h1,h2,p{margin:0}h1{font-size:25px;color:#173a5e}.eyebrow{font-size:14px;color:#4f708d;font-weight:600}.card{background:#fff;border:1px solid #dbe4ea;border-radius:18px;padding:25px;box-shadow:0 2px 7px #173a5e0c}.start{max-width:600px;margin:55px auto}.field{display:grid;gap:8px;margin-top:18px;font-size:14px;font-weight:700}input,textarea,select{font:inherit;border:1px solid #cbd7df;border-radius:8px;padding:10px;width:100%;background:#fff}textarea{min-height:90px;resize:vertical}button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:10px 15px;cursor:pointer;background:#173a5e;color:white}button:hover{background:#0e2b48}.outline{background:#fff;color:#173a5e;border:1px solid #8db7d5}.notice{background:#fff5d9;border:1px solid #f0d18b;color:#795900;padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.55;margin:15px 0}.bar{display:flex;justify-content:space-between;gap:10px;align-items:center}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button{background:white;color:#173a5e;border:1px solid #d8e1e8}.tabs button.active{background:#173a5e;color:white}.grid{display:grid;grid-template-columns:1fr 280px;gap:20px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.checks{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.checks label{border:1px solid #d5e0e7;border-radius:8px;padding:8px 10px;font-size:14px;font-weight:600}.checks input{width:auto;margin-right:6px}.members div{background:white;border-radius:8px;padding:9px;margin-top:8px;font-weight:600;font-size:14px}.summary{background:#173a5e;color:white}.summary .muted{color:#b8d9ef;font-size:13px}.summary .line{border-bottom:1px solid #ffffff29;padding:13px 0}.pos{color:#9ee1bf}.neg{color:#ffd09a}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:11px 8px;border-bottom:1px solid #e5edf1;text-align:left}th{color:#5d7180;font-size:12px}td:last-child,th:last-child{text-align:right}.delete{background:transparent;color:#a3afb7;padding:5px}.delete:hover{background:#fff0f0;color:#c93434}.hidden{display:none}.error{color:#b42318;margin-top:14px;font-size:14px}@media(max-width:760px){.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.bar{align-items:flex-start;flex-direction:column}table{font-size:12px}th,td{padding:8px 4px}}
</style></head><body><main><header class="brand"><div class="logo">￥</div><div><p class="eyebrow" id="subtitle">共同費用，清楚分攤</p><h1>一起算帳</h1></div></header><section id="start" class="start card"><h2>建立共同記帳群組</h2><p style="margin-top:7px;color:#637582;font-size:14px;line-height:1.6">建立後會得到專屬邀請連結。拿到連結的人都能查看、增加與刪除帳目。</p><form id="create"><label class="field">群組名稱<input id="gname" placeholder="例如：沖繩旅行、室友生活費" required></label><label class="field">成員姓名<textarea id="names" placeholder="例如：小明、小美、小華（可用逗號或換行分隔）" required></textarea></label><button style="width:100%;margin-top:22px">建立群組並取得連結 →</button><p id="startmsg" class="error"></p></form></section><section id="app" class="hidden"><div class="bar"><div><p class="eyebrow" id="groupname"></p><h2>共同帳本</h2></div><button id="copy" class="outline">複製邀請連結</button></div><p class="notice">邀請連結就是群組的編輯憑證。請只傳給可信任的人；取得連結的人可以讀取、建立與刪除帳目。</p><div class="tabs"><button class="active" data-tab="add">＋ 新增一筆</button><button data-tab="list">帳目總覽</button></div><p id="msg" class="error"></p><section id="addtab" class="grid"><form id="expense" class="card"><h2>填寫共同支出</h2><p style="margin-top:7px;color:#637582;font-size:14px">選擇誰先付款，以及哪些人要分攤。</p><div class="formgrid"><label class="field">付款人<select id="payer"></select></label><label class="field">金額<input id="amount" inputmode="decimal" placeholder="例如 1280" required></label></div><label class="field">項目<input id="item" placeholder="例如：晚餐、房租、日用品" required></label><div class="field">負擔費用的人<div id="split" class="checks"></div></div><label class="field">備註（選填）<textarea id="note" placeholder="例如：公司聚餐、含停車費"></textarea></label><div class="bar" style="margin-top:20px;border-top:1px solid #e6edf1;padding-top:16px"><span id="perperson" style="font-size:14px;color:#637582"></span><button>儲存帳目 →</button></div></form><aside class="card members"><h2>群組成員</h2><div id="memberlist"></div></aside></section><section id="listtab" class="hidden grid"><div class="card"><h2>帳目總覽</h2><p id="total" style="margin:7px 0 15px;color:#637582;font-size:14px"></p><div id="rows"></div></div><aside class="card summary"><p class="muted">目前分攤</p><h2>誰該收、誰該付</h2><div id="balances" style="margin-top:14px"></div></aside></section></section></main><script>
const API='https://shared-ledger-api.peige880.workers.dev';let group=null,expenses=[];const $=s=>document.querySelector(s),money=n=>new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(n);const setmsg=(s,where='#msg')=>$(where).textContent=s||'';function link(){let h=new URLSearchParams(location.hash.slice(1));return h.get('group')&&h.get('key')?{id:h.get('group'),key:h.get('key'),name:h.get('name')||'共同記帳',people:[]}:null}async function call(path,opt={},auth=group){let r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json',...(auth?{'X-Group-Key':auth.key}:{}),...(opt.headers||{})}}),b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.error||'服務暫時無法使用。');return b}function showApp(){ $('#start').classList.add('hidden');$('#app').classList.remove('hidden');$('#subtitle').textContent=group.name;$('#groupname').textContent=group.name;$('#payer').innerHTML=group.people.map(x=>`<option>${x}</option>`).join('');$('#memberlist').innerHTML=group.people.map(x=>`<div>${x}</div>`).join('');$('#split').innerHTML=group.people.map(x=>`<label><input type="checkbox" value="${x}" checked>${x}</label>`).join('');render()}async function load(){try{let d=await call('/groups/'+group.id,{},group);group={...group,...d.group};expenses=d.expenses;showApp()}catch(e){setmsg(e.message,'#startmsg')}}function render(){let total=expenses.reduce((s,x)=>s+x.amount,0);$('#total').textContent=`共 ${expenses.length} 筆，總支出 ${money(total)}`;$('#rows').innerHTML=expenses.length?`<table><thead><tr><th>日期</th><th>項目</th><th>付款人</th><th>分攤對象</th><th>金額</th><th></th></tr></thead><tbody>${expenses.map(x=>`<tr><td>${x.date}</td><td><b>${safe(x.item)}</b>${x.note?`<br><small>${safe(x.note)}</small>`:''}</td><td>${safe(x.payer)}</td><td>${x.people.map(safe).join('、')}</td><td>${money(x.amount)}</td><td><button class="delete" data-del="${x.id}">刪除</button></td></tr>`).join('')}</tbody></table>`:'<p style="color:#748494;padding:35px 0;text-align:center">還沒有帳目。</p>';let bal=group.people.map(p=>{let paid=expenses.filter(x=>x.payer===p).reduce((s,x)=>s+x.amount,0),share=expenses.reduce((s,x)=>s+(x.people.includes(p)?x.amount/x.people.length:0),0);return{p,paid,share,n:paid-share}});$('#balances').innerHTML=bal.map(x=>`<div class="line"><b>${safe(x.p)}</b><span class="${x.n>=0?'pos':'neg'}" style="float:right">${x.n>=0?'應收':'應付'} ${money(Math.abs(x.n))}</span><div class="muted" style="margin-top:5px">已付 ${money(x.paid)} · 應分攤 ${money(x.share)}</div></div>`).join('');document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('刪除此筆帳目？所有群組成員都會看見變更。'))try{await call('/groups/'+group.id+'/expenses/'+b.dataset.del,{method:'DELETE'});expenses=expenses.filter(x=>x.id!==b.dataset.del);render()}catch(e){setmsg(e.message)}})}function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('#create').onsubmit=async e=>{e.preventDefault();let people=[...new Set($('#names').value.split(/[、,，\n]/).map(x=>x.trim()).filter(Boolean))];try{setmsg('正在建立群組…','#startmsg');let d=await call('/groups',{method:'POST',body:JSON.stringify({name:$('#gname').value.trim(),people})},null);group={...d.group,key:d.key};location.hash=new URLSearchParams({group:group.id,key:group.key,name:group.name});setmsg('','#startmsg');showApp()}catch(e){setmsg(e.message,'#startmsg')}};$('#expense').onsubmit=async e=>{e.preventDefault();let people=[...document.querySelectorAll('#split input:checked')].map(x=>x.value),amount=Number($('#amount').value);if(!people.length||!amount||!$('#item').value.trim())return setmsg('請填寫項目、有效金額與至少一位分攤成員。');try{setmsg('正在儲存…');let d=await call('/groups/'+group.id+'/expenses',{method:'POST',body:JSON.stringify({payer:$('#payer').value,item:$('#item').value.trim(),amount,people,note:$('#note').value.trim()})});expenses.unshift(d.expense);$('#item').value=$('#amount').value=$('#note').value='';setmsg('');render()}catch(e){setmsg(e.message)}};$('#amount').oninput=()=>{let n=Number($('#amount').value),c=document.querySelectorAll('#split input:checked').length;$('#perperson').textContent=c&&n>0?'每人暫估 '+money(n/c):''};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));$('#addtab').classList.toggle('hidden',b.dataset.tab!=='add');$('#listtab').classList.toggle('hidden',b.dataset.tab!=='list')});$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$('#copy').textContent='✓ 已複製';setTimeout(()=>$('#copy').textContent='複製邀請連結',1600)}catch{setmsg('請直接複製網址列的連結。')}};group=link();if(group)load();
</script></body></html>
