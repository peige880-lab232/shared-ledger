<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一起算帳</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font:16px Arial,"Noto Sans TC",sans-serif;color:#164852;background:linear-gradient(153deg,#0aa9a4 0 40%,#087b8c 40.2%,#dff4f1 40.5%,#effafa 100%)}main{max-width:940px;margin:auto;padding:38px 18px 70px}.brand{display:flex;gap:14px;align-items:center;padding-bottom:24px;border-bottom:1px solid #ffffff88}.logo{display:grid;place-items:center;width:48px;height:48px;background:#0a9d9d;color:#fff;font-size:24px;box-shadow:12px 18px #006b7280}.ey,h1{margin:0;color:#fff}.ey{font-size:14px}h1{font-size:27px}h2{margin:0;color:#087f85}.card{background:#fcffff;border:1px solid #c5ffff;padding:26px;box-shadow:16px 20px #006d7180}.start{max-width:600px;margin:60px auto}.hint{color:#497d80;line-height:1.7;font-size:14px}.field{display:grid;gap:7px;margin-top:17px;font-size:14px;font-weight:700}input,textarea,select{width:100%;padding:11px;border:1px solid #9dd8d3;font:inherit}textarea{min-height:76px}button{border:0;padding:11px 16px;background:#079d9d;color:#fff;font:inherit;font-weight:700;box-shadow:5px 6px #006b7280;cursor:pointer}.outline{background:#efffff;color:#087f85;border:1px solid #8ee2dc}.notice{margin:18px 0;padding:13px;background:#ecfffa;color:#23756e;box-shadow:7px 8px #007b8460}.success{background:#d9fff1;color:#086c58}.bar,.tabs,.checks{display:flex;gap:10px;align-items:center}.bar{justify-content:space-between}.tabs{margin:24px 0}.tabs button{background:#f4ffff;color:#087f85;border:1px solid #a9e4df;box-shadow:4px 5px #006b7250}.tabs .on{background:#088f93;color:#fff}.grid{display:grid;grid-template-columns:1fr 270px;gap:24px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.checks{flex-wrap:wrap}.checks label{padding:8px;background:#f4ffff;border:1px solid #a8ded8;font-size:14px}.checks input{width:auto}.members div{background:#eafffa;border-left:3px solid #11aaa7;padding:10px;margin-top:8px}.summary{color:#fff;background:#087f85}.summary h2{color:#fff}.muted{color:#c7ffff;font-size:13px}.line{padding:13px 0;border-bottom:1px solid #fff5}.hide{display:none}#rows{overflow-x:auto}#rows table{min-width:700px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 7px;text-align:left;border-bottom:1px solid #d8efed}td:last-child,th:last-child{text-align:right}.person-chip{display:inline-block;margin:2px 4px 2px 0;padding:3px 6px;border-radius:999px;background:#eafffa;color:#087f85;font-size:12px;white-space:nowrap}@media(max-width:760px){.grid,.two{grid-template-columns:1fr}.bar{align-items:flex-start;flex-direction:column}}
</style>
<main><header class="brand"><div class="logo">￥</div><div><p class="ey" id="sub">一起記下生活裡的小花費</p><h1>一起算帳</h1></div></header>
<section id="start" class="start card"><h2>建立共享帳本</h2><p class="hint">填入帳本名稱與成員，即可開始共同記帳。</p><ul class="hint" style="padding-left:20px"><li>無須註冊或登入，建立後即可直接使用。</li><li>資料傳輸使用 HTTPS 加密，後端服務由 Cloudflare Workers 提供；請妥善保存邀請連結。</li></ul><form id="new"><label class="field">帳本名稱<input id="name" required></label><label class="field">成員名單<textarea id="people" placeholder="以逗號或換行分隔" required></textarea></label><button style="margin-top:22px">建立帳本 →</button></form></section>
<section id="app" class="hide"><div class="bar"><div><p class="ey" id="gname"></p><h1>共同帳本</h1></div><div class="checks"><button class="outline" id="home" type="button">回到首頁</button><button class="outline" id="copy" type="button">複製邀請連結</button></div></div><div class="notice">邀請連結可供成員共同查看與新增帳目。<br><b>請妥善保管：</b>這個邀請連結就是帳本的鑰匙，擁有連結的人即可存取帳本。<br><a id="invite" href="#" style="display:inline-block;margin-top:8px;color:#087f85;font-weight:700"></a></div><div class="tabs"><button class="on" data-tab="add" type="button">填寫花費</button><button data-tab="list" type="button">費用總覽</button></div><section id="add"><p id="success" class="notice success hide" role="status">花費已新增成功！現在可以填寫下一筆。</p><div class="grid"><form class="card" id="expense"><h2>填寫花費</h2><div class="two"><label class="field">付款人<select id="payer"></select></label><label class="field">金額<input id="amount" inputmode="decimal" required></label></div><label class="field">項目<input id="item" required></label><div class="field">分攤成員<div id="split" class="checks"></div></div><label class="field">備註（選填）<textarea id="note"></textarea></label><button style="margin-top:20px">新增花費 →</button></form><aside class="card members"><h2>帳本成員</h2><div id="member"></div></aside></div></section><section id="list" class="hide"><div class="grid"><div class="card"><div class="bar"><h2>全部帳目</h2><button class="outline" id="download" type="button">下載 CSV</button></div><p class="hint" id="total"></p><div id="rows"></div></div><aside class="card summary"><p class="muted">目前小結</p><h2>費用分攤</h2><div id="balance"></div></aside></div></section></section></main>
<script>
const A='https://shared-ledger-api.peige880.workers.dev',$=s=>document.querySelector(s),F=n=>new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(n);let g,rows=[],toast;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function q(p,o={},a=g){let r=await fetch(A+p,{...o,headers:{'Content-Type':'application/json',...(a?{'X-Group-Key':a.key}:{})}}),d=await r.json();if(!r.ok)throw Error(d.error||'操作失敗');return d}function inviteUrl(){return g.shortUrl||location.href}
function draw(){let t=rows.reduce((s,x)=>s+x.amount,0);$('#total').textContent=`共 ${rows.length} 筆，合計 ${F(t)}`;$('#rows').innerHTML='<table><tr><th>日期</th><th>項目</th><th>付款人</th><th>分攤成員</th><th>備註</th><th>金額</th><th>操作</th></tr>'+rows.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.item)}</td><td>${esc(x.payer)}</td><td>${x.people.map(p=>`<span class="person-chip">👤 ${esc(p)}</span>`).join('')}</td><td>${esc(x.note||'—')}</td><td>${F(x.amount)}</td><td><button class="outline delete-expense" type="button" data-id="${esc(x.id)}">刪除</button></td></tr>`).join('')+'</table>';$('#balance').innerHTML=g.people.map(p=>{let a=rows.filter(x=>x.payer===p).reduce((s,x)=>s+x.amount,0),b=rows.reduce((s,x)=>s+(x.people.includes(p)?x.amount/x.people.length:0),0);return `<div class="line"><b>${esc(p)}</b><span style="float:right">${a-b>=0?'多付 ':'少付 '}${F(Math.abs(a-b))}</span></div>`}).join('')}
function show(){$('#start').classList.add('hide');$('#app').classList.remove('hide');$('#sub').textContent=$('#gname').textContent=g.name;$('#payer').innerHTML=g.people.map(x=>`<option>${esc(x)}</option>`).join('');$('#member').innerHTML=g.people.map(x=>`<div>${esc(x)}</div>`).join('');$('#split').innerHTML=g.people.map(x=>`<label><input type="checkbox" value="${esc(x)}" checked>${esc(x)}</label>`).join('');$('#invite').href=inviteUrl();$('#invite').textContent=g.shortUrl||`${location.host}${location.pathname}#…${g.id.slice(0,8)}`;draw()}
$('#new').onsubmit=async e=>{e.preventDefault();try{let d=await q('/groups',{method:'POST',body:JSON.stringify({name:$('#name').value,people:$('#people').value.split(/[、,，\n]/).map(x=>x.trim()).filter(Boolean)})},null);g={...d.group,key:d.key,shortUrl:d.shortUrl||d.group.shortUrl};location.hash=new URLSearchParams({group:g.id,key:g.key,name:g.name});show()}catch(e){alert(e.message)}};
$('#expense').onsubmit=async e=>{e.preventDefault();try{let d=await q('/groups/'+g.id+'/expenses',{method:'POST',body:JSON.stringify({payer:$('#payer').value,item:$('#item').value,amount:+$('#amount').value,people:[...document.querySelectorAll('#split input:checked')].map(x=>x.value),note:$('#note').value})});rows.unshift(d.expense);e.target.reset();$('#success').classList.remove('hide');clearTimeout(toast);toast=setTimeout(()=>$('#success').classList.add('hide'),3000);draw()}catch(e){alert(e.message)}};
$('#rows').onclick=async e=>{const button=e.target.closest('.delete-expense');if(!button)return;const expense=rows.find(x=>x.id===button.dataset.id);if(!expense)return;if(!confirm(`確定要刪除「${expense.item}」這筆花費嗎？此操作無法復原。`))return;button.disabled=true;try{await q(`/groups/${g.id}/expenses/${encodeURIComponent(expense.id)}`,{method:'DELETE'});rows=rows.filter(x=>x.id!==expense.id);draw()}catch(error){alert(error.message);button.disabled=false}};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));$('#add').classList.toggle('hide',b.dataset.tab!=='add');$('#list').classList.toggle('hide',b.dataset.tab!=='list')});$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(inviteUrl());let b=$('#copy'),t=b.textContent;b.textContent='已複製！';setTimeout(()=>b.textContent=t,1600)}catch{alert('無法自動複製，請長按上方連結複製。')}};$('#home').onclick=()=>{location.hash='';location.reload()};$('#download').onclick=()=>{const quote=v=>`"${String(v??'').replaceAll('"','""')}"`;const csv=[['日期','項目','付款人','分攤成員','備註','金額'],...rows.map(x=>[x.date,x.item,x.payer,x.people.join('、'),x.note||'',x.amount])].map(row=>row.map(quote).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`全部帳目-${g.name}.csv`;a.click();URL.revokeObjectURL(url)};let h=new URLSearchParams(location.hash.slice(1));if(h.get('group')){g={id:h.get('group'),key:h.get('key'),name:h.get('name')};q('/groups/'+g.id).then(d=>{g={...g,...d.group,shortUrl:d.shortUrl||d.group.shortUrl||g.shortUrl};rows=d.expenses;show()}).catch(e=>alert(e.message))}
</script></html>
