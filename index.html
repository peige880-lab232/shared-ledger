<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一起算帳</title>
<style>*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:16px Arial,"Noto Sans TC",sans-serif;color:#164852;background:linear-gradient(153deg,#0aa9a4 0 40%,#087b8c 40.2%,#dff4f1 40.5%,#effafa 100%)}
main{max-width:980px;margin:auto;padding:38px 18px 70px}
.brand{display:flex;gap:14px;align-items:center;padding-bottom:24px;border-bottom:1px solid #ffffff88}
.logo{display:grid;place-items:center;width:48px;height:48px;background:#0a9d9d;color:#fff;font-size:24px;box-shadow:12px 18px #006b7280}
.ey,h1{margin:0;color:#fff}
.ey{font-size:14px}
h1{font-size:27px}
h2{margin:0;color:#087f85}
.card{background:#fcffff;border:1px solid #c5ffff;padding:26px;box-shadow:16px 20px #006d7180}
.start{max-width:600px;margin:60px auto}
.hint{color:#497d80;line-height:1.7;font-size:14px}
.field{display:grid;gap:7px;margin-top:17px;font-size:14px;font-weight:700}
.people-inputs,.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,textarea{width:100%;padding:11px;border:1px solid #9dd8d3;font:inherit}
textarea{min-height:76px}
button{border:0;padding:11px 16px;background:#079d9d;color:#fff;font:inherit;font-weight:700;box-shadow:5px 6px #006b7280;cursor:pointer}
.outline{background:#efffff;color:#087f85;border:1px solid #8ee2dc}
.notice{margin:18px 0;padding:13px;background:#ecfffa;color:#23756e;box-shadow:7px 8px #007b8460}
.success{background:#d9fff1;color:#086c58}
.error{background:#fff0f0;color:#a33}
.bar,.tabs,.checks{display:flex;gap:10px;align-items:center}
.bar{justify-content:space-between}
.tabs{margin:24px 0}
.tabs button{background:#f4ffff;color:#087f85;border:1px solid #a9e4df;box-shadow:4px 5px #006b7250}
.tabs .on{background:#088f93;color:#fff}
.grid{display:grid;grid-template-columns:1fr 270px;gap:24px}
.checks{flex-wrap:wrap}
.members div{background:#eafffa;border-left:3px solid #11aaa7;padding:10px;margin-top:8px}
.summary{color:#fff;background:#087f85}
.summary h2{color:#fff}
.muted{color:#c7ffff;font-size:13px}
.line{padding:13px 0;border-bottom:1px solid #fff5}
.hide{display:none}
#rows{overflow-x:auto}
#rows table{min-width:800px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 7px;text-align:left;border-bottom:1px solid #d8efed}
.chip{display:inline-block;margin:2px 4px 2px 0;padding:3px 6px;border-radius:999px;background:#eafffa;color:#087f85;font-size:12px}
.allocation{display:grid;gap:8px}
.allocation label{display:grid;grid-template-columns:28px minmax(80px,1fr) minmax(100px,140px) 16px;gap:9px;align-items:center;padding:8px;background:#f4ffff;border:1px solid #a8ded8}
.allocation input[type=checkbox]{width:auto}
.allocation input:disabled{background:#edf4f3}.allocation .unit{font-weight:700;line-height:1}
.allocation-total{font-size:13px;color:#497d80;text-align:right}
.bad{color:#a33;font-weight:700}
@media(max-width:760px){.grid,.two,.people-inputs{grid-template-columns:1fr}
.bar{align-items:flex-start;flex-direction:column}
.allocation label{grid-template-columns:28px 1fr 105px 16px}
}
</style>
<main><header class="brand"><div class="logo">￥</div><div><p class="ey" id="sub">一起記下生活裡的小花費</p><h1>一起算帳</h1></div></header>
<section id="start" class="start card"><h2>建立共享帳本</h2><p class="hint">填入帳本名稱與成員，即可開始共同記帳。</p><form id="new"><label class="field">帳本名稱<input id="name" required></label><div class="field"><span>成員名單</span><div id="people" class="people-inputs"><input placeholder="成員姓名" required><input placeholder="成員姓名" required></div><button class="outline" id="add-person" type="button">＋ 新增成員</button></div><button style="margin-top:22px">建立帳本 →</button></form></section>
<section id="app" class="hide"><div class="bar"><div><p class="ey" id="gname"></p><h1>共同帳本</h1></div><div class="checks"><button class="outline" id="home" type="button">回到首頁</button><button class="outline" id="copy" type="button">複製邀請連結</button></div></div><div class="notice">邀請連結可供成員共同查看與新增帳目。<br><a id="invite" href="#"></a></div><div class="tabs"><button class="on" data-tab="add" type="button">填寫花費</button><button data-tab="list" type="button">費用總覽</button></div><section id="add"><p id="success" class="notice success hide">花費已新增成功！</p><p id="form-error" class="notice error hide" role="alert"></p><div class="grid"><form class="card" id="expense"><h2>填寫花費</h2><div class="two"><label class="field">總金額<input id="amount" inputmode="decimal" min="0.01" step="0.01" required></label><label class="field">項目<input id="item" required></label></div><div class="field"><span>付款人與實付金額</span><div id="payments" class="allocation"></div><div id="payment-total" class="allocation-total"></div></div><div class="field"><span>分攤成員與比例</span><div id="splits" class="allocation"></div><div id="split-total" class="allocation-total"></div></div><label class="field">備註（選填）<textarea id="note"></textarea></label><button style="margin-top:20px">新增花費 →</button></form><aside class="card members"><h2>帳本成員</h2><div id="member"></div></aside></div></section><section id="list" class="hide"><div class="grid"><div class="card"><div class="bar"><h2>全部帳目</h2><button class="outline" id="download" type="button">下載 CSV</button></div><p class="hint" id="total"></p><div id="rows"></div></div><aside class="card summary"><p class="muted">目前小結</p><h2>費用分攤</h2><div id="balance"></div></aside></div></section></section></main>
<script>
const A='https://shared-ledger-api.peige880.workers.dev',$=s=>document.querySelector(s),F=n=>new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:2}).format(n),EPS=.01;let g,rows=[],toast;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>Number(Number(v||0).toFixed(2));
async function q(p,o={},a=g){let r=await fetch(A+p,{...o,headers:{'Content-Type':'application/json',...(a?{'X-Group-Key':a.key}:{})}}),d=await r.json();if(!r.ok)throw Error(d.error||'操作失敗');return d}function inviteUrl(){return g.shortUrl||location.href}function payments(x){return x.payments?.length?x.payments:(x.payer?[{person:x.payer,amount:x.amount}]:[])}function splits(x){return x.splits?.length?x.splits:(x.people||[]).map(person=>({person,percentage:100/(x.people||[]).length}))}function chips(a,k){return a.map(x=>`<span class="chip">👤 ${esc(x.person)} ${k==='p'?F(x.amount):Number(x.percentage).toFixed(2)+'%'}</span>`).join('')}
function draw(){let t=rows.reduce((s,x)=>s+Number(x.amount||0),0);$('#total').textContent=`共 ${rows.length} 筆，合計 ${F(t)}`;$('#rows').innerHTML='<table><tr><th>日期</th><th>項目</th><th>付款人（實付）</th><th>分攤成員（比例）</th><th>備註</th><th>金額</th><th>操作</th></tr>'+rows.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.item)}</td><td>${chips(payments(x),'p')}</td><td>${chips(splits(x),'s')}</td><td>${esc(x.note||'—')}</td><td>${F(x.amount)}</td><td><button class="outline delete-expense" type="button" data-id="${esc(x.id)}">刪除</button></td></tr>`).join('')+'</table>';$('#balance').innerHTML=g.people.map(p=>{let paid=rows.reduce((s,x)=>s+payments(x).filter(v=>v.person===p).reduce((a,v)=>a+Number(v.amount||0),0),0),owed=rows.reduce((s,x)=>{let a=splits(x),total=a.reduce((n,v)=>n+Number(v.percentage||0),0);return s+(total?a.filter(v=>v.person===p).reduce((n,v)=>n+Number(x.amount||0)*Number(v.percentage||0)/total,0):0)},0),n=paid-owed;return `<div class="line"><b>${esc(p)}</b><span style="float:right">${n>=0?'多付 ':'少付 '}${F(Math.abs(n))}</span></div>`}).join('')}
function row(person,type,on=true,v=''){return `<label><input type="checkbox" data-person="${esc(person)}" ${on?'checked':''}><span>${esc(person)}</span><input class="${type}-value" data-person="${esc(person)}" inputmode="decimal" min="0" step="0.01" value="${v}" ${on?'':'disabled'}>${type==='split'?'<span class="unit">%</span>':''}</label>`}function even(){let a=[...document.querySelectorAll('#splits input[type=checkbox]:checked')],n=a.length;if(!n)return;a.forEach((x,i)=>document.querySelector(`#splits .split-value[data-person="${CSS.escape(x.dataset.person)}"]`).value=(i===n-1?100-100/n*(n-1):100/n).toFixed(2))}function syncSinglePayerAmount(){let inputs=[...document.querySelectorAll('.payment-value:not(:disabled)')],amount=money($('#amount').value);if(inputs.length===1&&amount>0)inputs[0].value=amount.toFixed(2)}function totals(){let a=money($('#amount').value),p=money([...document.querySelectorAll('.payment-value:not(:disabled)')].reduce((s,x)=>s+Number(x.value||0),0)),s=money([...document.querySelectorAll('.split-value:not(:disabled)')].reduce((z,x)=>z+Number(x.value||0),0));$('#payment-total').textContent=`實付合計 ${F(p)}${a?'／總金額 '+F(a):''}`;$('#payment-total').classList.toggle('bad',!!a&&Math.abs(p-a)>=EPS);$('#split-total').textContent=`分攤比例合計 ${s.toFixed(2)}%（依比例分配）`;$('#split-total').classList.remove('bad')}
function show(){$('#start').classList.add('hide');$('#app').classList.remove('hide');$('#sub').textContent=$('#gname').textContent=g.name;$('#member').innerHTML=g.people.map(x=>`<div>${esc(x)}</div>`).join('');$('#payments').innerHTML=g.people.map((x,i)=>row(x,'payment',i===0)).join('');$('#splits').innerHTML=g.people.map(x=>row(x,'split')).join('');even();$('#invite').href=inviteUrl();$('#invite').textContent=g.shortUrl||`${location.host}${location.pathname}#…${g.id.slice(0,8)}`;totals();draw()}function reset(){ $('#expense').reset();document.querySelectorAll('#payments input[type=checkbox]').forEach((x,i)=>{x.checked=i===0;document.querySelector(`#payments .payment-value[data-person="${CSS.escape(x.dataset.person)}"]`).disabled=!x.checked});document.querySelectorAll('#splits input[type=checkbox]').forEach(x=>{x.checked=true;document.querySelector(`#splits .split-value[data-person="${CSS.escape(x.dataset.person)}"]`).disabled=false});even();totals()}
$('#add-person').onclick=()=>{let i=document.createElement('input');i.placeholder='成員姓名';i.required=true;$('#people').append(i)};$('#new').onsubmit=async e=>{e.preventDefault();try{let d=await q('/groups',{method:'POST',body:JSON.stringify({name:$('#name').value,people:[...$('#people').querySelectorAll('input')].map(x=>x.value.trim()).filter(Boolean)})},null);g={...d.group,key:d.key,shortUrl:d.shortUrl||d.group.shortUrl};location.hash=new URLSearchParams({group:g.id,key:g.key,name:g.name});show()}catch(e){alert(e.message)}};
$('#amount').oninput=()=>{syncSinglePayerAmount();totals()};$('#payments').oninput=totals;$('#splits').oninput=totals;$('#payments').onchange=e=>{if(e.target.type==='checkbox'){document.querySelector(`#payments .payment-value[data-person="${CSS.escape(e.target.dataset.person)}"]`).disabled=!e.target.checked;syncSinglePayerAmount();totals()}};$('#splits').onchange=e=>{if(e.target.type==='checkbox'){document.querySelector(`#splits .split-value[data-person="${CSS.escape(e.target.dataset.person)}"]`).disabled=!e.target.checked;even();totals()}};
$('#expense').onsubmit=async e=>{e.preventDefault();let amount=money($('#amount').value),paid=[...document.querySelectorAll('.payment-value:not(:disabled)')].map(x=>({person:x.dataset.person,amount:money(x.value)})).filter(x=>x.amount>0),share=[...document.querySelectorAll('.split-value:not(:disabled)')].map(x=>({person:x.dataset.person,percentage:money(x.value)})),pt=money(paid.reduce((s,x)=>s+x.amount,0)),err=!amount?'請輸入大於 0 的總金額。':!paid.length?'請至少選擇一位付款人並填入實付金額。':Math.abs(pt-amount)>=EPS?'付款人的實付合計必須等於總金額。':!share.length?'請至少選擇一位分攤成員。':share.some(x=>x.percentage<=0)?'每位分攤成員的比例必須大於 0。':'';$('#form-error').textContent=err;$('#form-error').classList.toggle('hide',!err);if(err)return;try{let d=await q('/groups/'+g.id+'/expenses',{method:'POST',body:JSON.stringify({item:$('#item').value,amount,payments:paid,splits:share,note:$('#note').value})});rows.unshift(d.expense);reset();$('#success').classList.remove('hide');clearTimeout(toast);toast=setTimeout(()=>$('#success').classList.add('hide'),3000);draw()}catch(e){$('#form-error').textContent=e.message;$('#form-error').classList.remove('hide')}};
$('#rows').onclick=async e=>{let b=e.target.closest('.delete-expense'),x=rows.find(x=>x.id===b?.dataset.id);if(!x||!confirm(`確定要刪除「${x.item}」這筆花費嗎？此操作無法復原。`))return;b.disabled=true;try{await q(`/groups/${g.id}/expenses/${encodeURIComponent(x.id)}`,{method:'DELETE'});rows=rows.filter(y=>y.id!==x.id);draw()}catch(e){alert(e.message);b.disabled=false}};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));$('#add').classList.toggle('hide',b.dataset.tab!=='add');$('#list').classList.toggle('hide',b.dataset.tab!=='list')});$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(inviteUrl());let b=$('#copy'),t=b.textContent;b.textContent='已複製！';setTimeout(()=>b.textContent=t,1600)}catch{alert('無法自動複製，請長按上方連結複製。')}};$('#home').onclick=()=>{location.hash='';location.reload()};$('#download').onclick=()=>{let q=v=>`"${String(v??'').replaceAll('"','""')}"`,p=x=>payments(x).map(v=>`${v.person} ${v.amount}`).join('、'),s=x=>splits(x).map(v=>`${v.person} ${Number(v.percentage).toFixed(2)}%`).join('、'),csv=[['日期','項目','付款人（實付）','分攤成員（比例）','備註','總金額'],...rows.map(x=>[x.date,x.item,p(x),s(x),x.note||'',x.amount])].map(x=>x.map(q).join(',')).join('\r\n'),u=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=`全部帳目-${g.name}.csv`;a.click();URL.revokeObjectURL(u)};let h=new URLSearchParams(location.hash.slice(1));if(h.get('group')){g={id:h.get('group'),key:h.get('key'),name:h.get('name')};q('/groups/'+g.id).then(d=>{g={...g,...d.group,shortUrl:d.shortUrl||d.group.shortUrl};rows=d.expenses;show()}).catch(e=>alert(e.message))}
</script></html>
