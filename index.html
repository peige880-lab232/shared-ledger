<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一起算帳</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font:16px system-ui;color:#164852;background:linear-gradient(153deg,#0aa9a4 0 41%,#087b8c 41.2%,#dff4f1 41.5%,#effafa 100%)}main{max-width:940px;margin:auto;padding:38px 18px 70px}.brand{display:flex;gap:14px;align-items:center;padding-bottom:24px;border-bottom:1px solid #ffffff88}.logo{display:grid;place-items:center;width:48px;height:48px;background:#0a9d9d;color:#fff;font-size:24px;transform:skewY(-8deg);box-shadow:12px 18px #006b7280}.ey{margin:0;color:#e9ffff;font-size:14px;letter-spacing:.08em}h1{margin:2px 0;color:#fff;font-size:27px;text-shadow:1px 2px #00676e}h2{margin:0;color:#087f85}.card{background:#fcffffe8;border:1px solid #c5ffff;padding:26px;box-shadow:16px 20px #006d7180;backdrop-filter:blur(8px)}.start{max-width:600px;margin:60px auto;transform:perspective(900px) rotateY(-3deg)}.hint{color:#497d80;line-height:1.7;font-size:14px}.field{display:grid;gap:7px;margin-top:17px;font-size:14px;font-weight:700}input,textarea,select{width:100%;padding:11px;border:1px solid #9dd8d3;background:#fff;color:#164852;font:inherit}textarea{min-height:76px}button{border:0;padding:11px 16px;background:#079d9d;color:#fff;font:inherit;font-weight:700;cursor:pointer;box-shadow:5px 6px #006b7280}.outline{background:#efffff;color:#087f85;border:1px solid #8ee2dc}.notice{margin:18px 0;padding:13px 15px;background:#ecfffae6;color:#23756e;box-shadow:7px 8px #007b8460;line-height:1.6}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center}.tabs{display:flex;gap:10px;margin:24px 0}.tabs button{background:#f4ffff;color:#087f85;border:1px solid #a9e4df;box-shadow:4px 5px #006b7250}.tabs .on{background:#088f93;color:#fff}.grid{display:grid;grid-template-columns:1fr 270px;gap:24px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.checks{display:flex;gap:8px;flex-wrap:wrap}.checks label{padding:8px 10px;background:#f4ffff;border:1px solid #a8ded8;font-size:14px}.checks input{width:auto}.members,.summary{transform:perspective(900px) rotateY(3deg)}.members div{background:#eafffa;border-left:3px solid #11aaa7;padding:10px;margin-top:8px}.summary{color:#fff;background:linear-gradient(145deg,#069fa0,#08758b)}.summary h2{color:#fff}.muted{color:#c7ffff;font-size:13px}.line{padding:13px 0;border-bottom:1px solid #fff5}.pos{color:#d4ffba}.neg{color:#fff0b1}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 7px;text-align:left;border-bottom:1px solid #d8efed}th{color:#358187;font-size:12px}td:last-child,th:last-child{text-align:right}.hide{display:none}.error{color:#a75354;font-size:14px}@media(max-width:760px){.grid,.two{grid-template-columns:1fr}.start,.members,.summary{transform:none}.bar{align-items:flex-start;flex-direction:column}}</style><main><header class="brand"><div class="logo">￥</div><div><p class="ey" id="sub">一起記下生活裡的小花費</p><h1>一起算帳</h1></div></header><section id="start" class="start card"><h2>建立共享帳本</h2><p class="hint">填入帳本名稱與成員，即可取得專屬連結並開始共同記帳。</p><form id="new"><label class="field">帳本名稱<input id="name" required></label><label class="field">成員名單<textarea id="people" placeholder="以逗號或換行分隔" required></textarea></label><button style="width:100%;margin-top:22px">建立帳本 →</button><p id="startmsg" class="error"></p></form></section><section id="app" class="hide"><div class="bar"><div><p class="ey" id="gname"></p><h1>共同帳本</h1></div><button class="outline" id="copy">複製邀請連結</button></div><p class="notice">邀請連結可供成員共同查看與新增帳目，請只分享給帳本成員。</p><div class="tabs"><button class="on" data="add">填寫花費</button><button data="list">費用總覽</button></div><p id="msg" class="error"></p><section id="add"><div class="grid"><form class="card" id="expense"><h2>填寫花費</h2><p class="hint">記錄付款人、項目、金額與分攤成員。</p><div class="two"><label class="field">付款人<select id="payer"></select></label><label class="field">金額<input id="amount" inputmode="decimal" required></label></div><label class="field">項目<input id="item" required></label><div class="field">分攤成員<div id="split" class="checks"></div></div><label class="field">備註（選填）<textarea id="note"></textarea></label><button style="margin-top:20px">新增花費 →</button></form><aside class="card members"><h2>帳本成員</h2><div id="member"></div></aside></div></section><section id="list" class="hide"><div class="grid"><div class="card"><h2>全部帳目</h2><p class="hint" id="total"></p><div id="rows"></div></div><aside class="card summary"><p class="muted">目前小結</p><h2>費用分攤</h2><div id="balance"></div></aside></div></section></section></main><script>const A='https://shared-ledger-api.peige880.workers.dev',$=s=>document.querySelector(s),F=n=>new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(n);let g,rows=[];function E(x){return String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function say(x,a='#msg'){$(a).textContent=x||''}async function q(p,o={},a=g){let r=await fetch(A+p,{...o,headers:{'Content-Type':'application/json',...(a?{'X-Group-Key':a.key}:{})}}),d=await r.json();if(!r.ok)throw Error(d.error||'目前無法處理。');return d}function render(){let t=rows.reduce((s,x)=>s+x.amount,0);$('#total').textContent='共 '+rows.length+' 筆，合計 '+F(t);$('#rows').innerHTML=rows.length?'<table><tr><th>日期</th><th>項目</th><th>付款人</th><th>分攤成員</th><th>金額</th></tr>'+rows.map(x=>'<tr><td>'+x.date+'</td><td><b>'+E(x.item)+'</b>'+(x.note?'<br><small>'+E(x.note)+'</small>':'')+'</td><td>'+E(x.payer)+'</td><td>'+x.people.map(E).join('、')+'</td><td>'+F(x.amount)+'</td></tr>').join('')+'</table>':'<p class="hint">尚未新增花費。</p>';$('#balance').innerHTML=g.people.map(p=>{let paid=rows.filter(x=>x.payer===p).reduce((s,x)=>s+x.amount,0),part=rows.reduce((s,x)=>s+(x.people.includes(p)?x.amount/x.people.length:0),0),n=paid-part;return '<div class="line"><b>'+E(p)+'</b><span class="'+(n>=0?'pos':'neg')+'" style="float:right">'+(n>=0?'多付':'少付')+' '+F(Math.abs(n))+'</span><div class="muted">已付 '+F(paid)+' · 分攤 '+F(part)+'</div></div>'}).join('')}function show(){$('#start').classList.add('hide');$('#app').classList.remove('hide');$('#sub').textContent=$('#gname').textContent=g.name;$('#payer').innerHTML=g.people.map(x=>'<option>'+E(x)+'</option>').join('');$('#member').innerHTML=g.people.map(x=>'<div>'+E(x)+'</div>').join('');$('#split').innerHTML=g.people.map(x=>'<label><input type="checkbox" value="'+E(x)+'" checked>'+E(x)+'</label>').join('');render()}$('#new').onsubmit=async e=>{e.preventDefault();try{let p=$('#people').value.split(/[、,，\n]/).map(x=>x.trim()).filter(Boolean),d=await q('/groups',{method:'POST',body:JSON.stringify({name:$('#name').value.trim(),people:p})},null);g={...d.group,key:d.key};location.hash=new URLSearchParams({group:g.id,key:g.key,name:g.name});show()}catch(e){say(e.message,'#startmsg')}};$('#expense').onsubmit=async e=>{e.preventDefault();let p=[...document.querySelectorAll('#split input:checked')].map(x=>x.value),n=Number($('#amount').value);if(!p.length||!n||!$('#item').value.trim())return say('請填寫項目、金額與分攤成員。');try{let d=await q('/groups/'+g.id+'/expenses',{method:'POST',body:JSON.stringify({payer:$('#payer').value,item:$('#item').value.trim(),amount:n,people:p,note:$('#note').value.trim()})});rows.unshift(d.expense);$('#item').value=$('#amount').value=$('#note').value='';render()}catch(e){say(e.message)}};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));$('#add').classList.toggle('hide',b.dataset!=='add');$('#list').classList.toggle('hide',b.dataset!=='list')});$('#copy').onclick=()=>navigator.clipboard.writeText(location.href);let h=new URLSearchParams(location.hash.slice(1));if(h.get('group')){g={id:h.get('group'),key:h.get('key'),name:h.get('name')};q('/groups/'+g.id).then(d=>{g={...g,...d.group};rows=d.expenses;show()})}</script>
