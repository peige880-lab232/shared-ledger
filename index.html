<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一起算帳</title><style>body{margin:0;min-height:100vh;font:16px system-ui;color:#174852;background:linear-gradient(153deg,#09aaa5 0 41%,#007d8e 41.2%,#dff4f1 41.5%,#effafa 100%)}main{max-width:900px;margin:auto;padding:38px 18px}.brand{display:flex;gap:14px;align-items:center;border-bottom:1px solid #ffffff80;padding-bottom:24px}.logo{display:grid;place-items:center;width:48px;height:48px;background:#0a9d9d;color:#fff;font-size:24px;transform:skewY(-8deg);box-shadow:12px 18px #006b7280}h1{color:#fff;margin:0;text-shadow:1px 2px #00676e}.ey{color:#e9ffff;margin:0;font-size:14px}.card{margin:45px auto;max-width:600px;padding:28px;background:#fcffffe8;border:1px solid #c5ffff;box-shadow:16px 20px #006d7180;transform:perspective(900px) rotateY(-3deg)}input,textarea,select{box-sizing:border-box;width:100%;margin:7px 0 16px;padding:11px;border:1px solid #9dd8d3;background:#fff;font:inherit}label{font-weight:700;font-size:14px}button{padding:11px 16px;border:0;background:#079d9d;color:#fff;font:inherit;font-weight:700;box-shadow:5px 6px #006b7280}.notice{padding:14px;background:#ecfffae6;color:#23756e;box-shadow:7px 8px #007b8460;line-height:1.6}.hide{display:none}.people{display:flex;gap:8px;flex-wrap:wrap}.people label{padding:8px;background:#efffff;border:1px solid #a8ded8}.err{color:#a75354}</style><main><header class="brand"><div class="logo">￥</div><div><p class="ey">一起記下生活裡的小花費</p><h1>一起算帳</h1></div></header><section id="new" class="card"><h2>開一個一起記的帳本</h2><p>寫下夥伴的名字，就能拿到一個專屬連結，大家可以一起慢慢把帳記好。</p><form id="f"><label>這本帳叫什麼名字？<input id="n" required></label><label>和誰一起記？<textarea id="p" required></textarea></label><button>建立帳本，取得專屬連結 →</button><p id="e" class="err"></p></form></section><section id="app" class="hide"><p class="ey" id="gn"></p><h1>我們一起記的帳</h1><p class="notice">這個邀請連結就像帳本的小鑰匙。分享給想一起記帳的夥伴就好。</p><button id="copy">複製邀請連結</button><form class="card" id="x"><h2>寫下一筆花費</h2><label>誰先付？<select id="payer"></select></label><label>這次多少錢？<input id="amt" type="number" required></label><label>花在什麼地方？<input id="item" required></label><div id="who" class="people"></div><button>好，記下來 →</button><p id="m" class="err"></p></form><div class="card" id="list"></div></section></main><script>const A='https://shared-ledger-api.peige880.workers.dev';let g,rows=[];const $=s=>document.querySelector(s),h=new URLSearchParams(location.hash.slice(1));async function q(p,o={},a=g){let r=await fetch(A+p,{...o,headers:{'Content-Type':'application/json',...(a?{'X-Group-Key':a.key}:{})}}),d=await r.json();if(!r.ok)throw Error(d.error);return d}function show(){$('#new').classList.add('hide');$('#app').classList.remove('hide');$('#gn').textContent=g.name;$('#payer').innerHTML=g.people.map(x=>'<option>'+x+'</option>').join('');$('#who').innerHTML=g.people.map(x=>'<label><input type="checkbox" value="'+x+'" checked>'+x+'</label>').join('');draw()}function draw(){$('#list').innerHTML='<h2>這本帳的每一筆</h2>'+rows.map(x=>'<p>'+x.date+'　<b>'+x.item+'</b>　'+x.payer+'　$'+x.amount+'</p>').join('')}$('#f').onsubmit=async e=>{e.preventDefault();try{let d=await q('/groups',{method:'POST',body:JSON.stringify({name:$('#n').value,people:$('#p').value.split(/[、,，\n]/).filter(Boolean)})},null);g={...d.group,key:d.key};location.hash=new URLSearchParams({group:g.id,key:g.key,name:g.name});show()}catch(e){$('#e').textContent=e.message}};$('#x').onsubmit=async e=>{e.preventDefault();try{let d=await q('/groups/'+g.id+'/expenses',{method:'POST',body:JSON.stringify({payer:$('#payer').value,item:$('#item').value,amount:+$('#amt').value,people:[...document.querySelectorAll('#who input:checked')].map(x=>x.value),note:''})});rows.unshift(d.expense);draw()}catch(e){$('#m').textContent=e.message}};$('#copy').onclick=()=>navigator.clipboard.writeText(location.href);if(h.get('group')){g={id:h.get('group'),key:h.get('key'),name:h.get('name'),people:[]};q('/groups/'+g.id).then(d=>{g={...g,...d.group};rows=d.expenses;show()})}</script>
